{% load socialaccount static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar entrada | FEED-ON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'pipeline/styles.css' %}" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel">
      <p class="eyebrow">Google</p>
      <h1>Confirmar entrada</h1>
      <p class="auth-copy">O FEED-ON usara sua conta Google para identificar seus dados no sistema.</p>
      <form method="post">
        {% csrf_token %}
        <button class="google-login-button" type="submit">
          <span class="google-mark" aria-hidden="true">G</span>
          <span>Continuar com Google</span>
        </button>
      </form>
    </section>
  </main>
</body>
</html>
